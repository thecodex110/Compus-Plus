<div class="field">
  <span class="label">{{ field.label }}</span>
  <div class="pills">
    {% for radio in field %}<label class="pill-opt">{{ radio.tag }}<span>{{ radio.choice_label }}</span></label>{% endfor %}
  </div>
  {% for e in field.errors %}<small class="err">{{ e }}</small>{% endfor %}
</div>
