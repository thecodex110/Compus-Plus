<form method="post" action="{% url 'printing:toggle_open' %}" class="shop-bar {% if shop.is_open %}is-open{% endif %}">
  {% csrf_token %}
  <div>
    <div class="shop-bar-name">{{ shop.name }}</div>
    <div class="small">{% if shop.is_open %}Open — students can order{% else %}Closed — students can't order{% endif %}</div>
  </div>
  <button class="switch" role="switch" aria-checked="{{ shop.is_open|yesno:'true,false' }}" aria-label="Shop open">
    <span></span>
  </button>
</form>
{% if not shop.qr_image %}
  <div class="flash flash-error">Add your payment QR code in <a href="{% url 'printing:shop_settings' %}">Settings</a> before opening.</div>
{% endif %}
