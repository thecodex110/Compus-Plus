{% load i18n %}
<ol class="timeline">
  {% for ev in events %}
    <li class="{% if ev.status == 'rejected' %}stop{% endif %}"><b>{{ ev.get_status_display }}</b><span>{{ ev.at|date:"j M, g:i A" }}{% if ev.note %}&nbsp;· {{ ev.note }}{% endif %}</span></li>
  {% endfor %}
  {% if order.next_status %}<li class="todo"><b>{{ order.next_status.label }}</b><span>{% translate "next" %}</span></li>{% endif %}
</ol>
